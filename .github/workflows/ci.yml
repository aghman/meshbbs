name: CI

on:
  push:
    branches: [main]
  pull_request:

# NOTE: CGO_ENABLED=0 is set per-job, not globally.
#
# The cgo-free requirement (§4, §10) is about the binaries we ship, and the
# build job asserts it. Applying it to the test job breaks `go test -race`,
# because the race detector needs cgo on Linux and Windows — darwin happens to
# tolerate CGO_ENABLED=0 with -race, which is a good way to have this pass
# locally on a Mac and fail everywhere else.

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # A real Windows runner is non-negotiable from Phase 4 (ConPTY, §12.9).
        # It is here from Phase 0 so that path handling and file permissions are
        # exercised on Windows continuously rather than discovered later.
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify formatting
        if: matrix.os == 'ubuntu-latest'
        run: |
          unformatted=$(gofmt -l . | grep -v '^internal/identity/wordlist.go$' || true)
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: Determinism check (design §12.1)
        if: matrix.os == 'ubuntu-latest'
        run: go run ./tools/checkdeterminism ./...

      - name: Test
        run: go test -race ./...

  build:
    name: Cross-compile
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          # Raspberry Pi — likely the most common deployment (§10).
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          out="meshbbs-${GOOS}-${GOARCH}"
          [ "$GOOS" = "windows" ] && out="${out}.exe"
          go build -trimpath -ldflags "-s -w -X github.com/aghman/meshbbs/internal/cli.Version=${GITHUB_SHA::8}" \
            -o "$out" ./cmd/meshbbs
          ls -la "$out"

      - name: Assert the binary is not dynamically linked
        # §4 calls cgo-free non-negotiable, so assert it rather than trusting
        # CGO_ENABLED to have been honoured. A cgo build would pull in libc and
        # break cross-compilation for every target at once.
        if: matrix.goos == 'linux'
        run: |
          out="meshbbs-${{ matrix.goos }}-${{ matrix.goarch }}"
          if file "$out" | grep -q "dynamically linked"; then
            echo "FAIL: $out is dynamically linked; the build is not cgo-free"
            file "$out"
            exit 1
          fi
          file "$out"

      - uses: actions/upload-artifact@v4
        with:
          name: meshbbs-${{ matrix.goos }}-${{ matrix.goarch }}
          path: meshbbs-*
          retention-days: 7

  smoke:
    name: Smoke test the built binary
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # §12.9: the binaries must RUN, not merely compile.
      - name: Initialise and exercise an instance
        env:
          CGO_ENABLED: "0"
        run: |
          set -euo pipefail
          go build -o ./meshbbs ./cmd/meshbbs
          D=$(mktemp -d)

          # NOT --sysop-nick sysop: "sysop" is a reserved nick (§5.1), so
          # nobody can register an account that impersonates the role.
          ./meshbbs --data-dir "$D" init \
            --display-name ci-node --sysop-nick ciadmin --development

          ./meshbbs --data-dir "$D" config check
          ./meshbbs --data-dir "$D" id

          # Both renderings must decode to the same identifier (§6.1.4.2).
          COMPACT=$(./meshbbs --data-dir "$D" id --compact)
          WORDS=$(./meshbbs --data-dir "$D" id --words)
          test "${#COMPACT}" -eq 13
          test "$(echo "$WORDS" | tr '-' '\n' | wc -l)" -eq 6
          ./meshbbs --data-dir "$D" peer alias self "$WORDS"
          ./meshbbs --data-dir "$D" peer resolve self | grep -q "${COMPACT:0:4}"

          ./meshbbs --data-dir "$D" user add bob
          ./meshbbs --data-dir "$D" user list
          ./meshbbs --data-dir "$D" dev seed --seed 1 --users 3 --posts 10

          # A sysop reset must refuse to silently destroy DM history (§6.7).
          ./meshbbs --data-dir "$D" dev seed --seed 2 --users 1 --posts 0 >/dev/null
          echo "newpassword" | ./meshbbs --data-dir "$D" user passwd bob

          # Doors are database rows, not config, so the CLI is the only way to
          # install one and the only place a bad one can be caught (§11.5).
          ./meshbbs --data-dir "$D" door add tradewars /bin/echo --limit 30m
          ./meshbbs --data-dir "$D" door list | grep -q tradewars
          ./meshbbs --data-dir "$D" door show tradewars | grep -q "api_level"
          ./meshbbs --data-dir "$D" door disable tradewars
          ./meshbbs --data-dir "$D" door remove tradewars

          # The reference doors must install and be launchable (§9.1). This is
          # the proof-of-life a sysop runs before pointing the board at
          # somebody else's software, so it must survive a release.
          ./meshbbs --data-dir "$D" door examples
          ./meshbbs --data-dir "$D" door list | grep -q guess
          # Spaces, not a tab: the column is laid out by text/tabwriter.
          ./meshbbs --data-dir "$D" door show hello | grep -qE "api_level +1 "
          ./meshbbs --data-dir "$D" door remove hello
          ./meshbbs --data-dir "$D" door remove guess

          # A memory limit is enforceable on Linux and not on macOS, and the
          # difference must be visible where a sysop sets one rather than when a
          # player cannot start the game (§9.4).
          ./meshbbs --data-dir "$D" door add capped /bin/echo --mem-limit 67108864
          ./meshbbs --data-dir "$D" door show capped | grep -q "67108864 bytes"
          ./meshbbs --data-dir "$D" door remove capped

          # A door too long to post under must be refused when it is installed,
          # not when it first tries to announce (§9.1.1, author field is 16B).
          if ./meshbbs --data-dir "$D" door add averylongdoorname /bin/echo \
               --announce-area general; then
            echo "FAIL: accepted a door whose name cannot fit a post author"
            exit 1
          fi

          # An unknown config key must fail the check (§11.3).
          echo 'levle = "debug"' >> "$D/config.toml"
          if ./meshbbs --data-dir "$D" config check; then
            echo "FAIL: config check accepted an unknown key"
            exit 1
          fi
          echo "smoke test passed"

  fuzz:
    name: Fuzz parsers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # §12.5: every parser is reachable by anyone holding the channel PSK, so
      # a short fuzz run gates each change. Long campaigns belong in a
      # scheduled job, not the PR path.
      # Every wire parser gets a short run on each change. These found three
      # real canonicality bugs — overlong varints in the record codec and the
      # version vector, and unvalidated reserved bits in the symbol header —
      # each of which gave one logical value two wire forms.
      #
      # Targets run through scripts/fuzz.sh rather than `go test` directly. Go's
      # fuzzing coordinator reports "context deadline exceeded" as a FAILURE
      # when the time budget expires while a worker call is in flight, which
      # gives a red build with no failing input and nothing to fix. The script
      # fails on any real finding and tolerates only that specific case; see the
      # comment at the top of it.
      - name: Fuzz record parser
        run: .github/scripts/fuzz.sh ./internal/record FuzzUnmarshal 45s
      - name: Fuzz version vector parser
        run: .github/scripts/fuzz.sh ./internal/vv FuzzDecode 30s
      - name: Fuzz symbol parser
        run: .github/scripts/fuzz.sh ./internal/fountain FuzzDecodeSymbol 30s
      - name: Fuzz bundle parser
        run: .github/scripts/fuzz.sh ./internal/bundle FuzzUnpack 30s
      # The body parser, fuzzed WITHOUT compression in the way. Going through
      # Unpack requires a valid zstd frame first, so the parser that walks
      # attacker-controlled structure was effectively unfuzzed and carried three
      # canonicality bugs.
      - name: Fuzz bundle body parser
        run: .github/scripts/fuzz.sh ./internal/bundle FuzzDecodeBody 30s
      # Gossip control messages are the newest attack surface, and a
      # non-canonical one is worse than a parse error: two converged nodes would
      # read identical state as divergent and exchange deltas forever.
      - name: Fuzz gossip digest parser
        run: .github/scripts/fuzz.sh ./internal/gossip FuzzDecodeDigest 30s
      - name: Fuzz gossip range-request parser
        run: .github/scripts/fuzz.sh ./internal/gossip FuzzDecodeRangeReq 30s
      - name: Fuzz gossip vector-request parser
        run: .github/scripts/fuzz.sh ./internal/gossip FuzzDecodeVectorReq 20s
      # A profile nick arrives from a stranger's instance and is rendered into a
      # terminal, so the parser is both a canonicality and an ANSI-injection
      # boundary.
      - name: Fuzz profile parser
        run: .github/scripts/fuzz.sh ./internal/profile FuzzUnmarshalProfileBody 20s
      # A FILE body arrives from a stranger's instance and becomes both a line
      # in a terminal and a filename. Its size is a varint, which is where the
      # first run of this target found a non-canonical encoding: 80 00 and 00
      # both mean zero, so one catalog entry had two content addresses.
      - name: Fuzz FILE catalog parser
        run: .github/scripts/fuzz.sh ./internal/record FuzzUnmarshalFileBody 20s
      # The serial framer sees whatever the wire produces: firmware debug text,
      # a fragment left over from a client that died mid-frame, and pure noise
      # at the wrong baud rate. Its length field is also the one place in the
      # codebase where an attacker-adjacent number sizes an allocation.
      - name: Fuzz Meshtastic frame reader
        run: .github/scripts/fuzz.sh ./internal/meshtastic FuzzReadFrame 30s
      # The announcement parser decides which node ID a radio address belongs
      # to, and it runs before any of the trust machinery above it. A parser bug
      # that let the ID and the key disagree would hand an attacker a peer's
      # inbound traffic.
      - name: Fuzz mesh announcement parser
        run: .github/scripts/fuzz.sh ./internal/meshlink FuzzDecodeAnnounce 30s
      # The door API's request parser. Unlike every target above it, what is on
      # the other end is not a stranger on the mesh but a third-party binary the
      # sysop installed, running with the server's privileges (§9.4) — no
      # channel PSK to get past first, and a million malformed requests a second
      # if it likes. The property is that a door cannot take the BBS down by
      # talking nonsense to it.
      - name: Fuzz door API request parser
        run: .github/scripts/fuzz.sh ./internal/door FuzzAPIRequest 30s
      # Dropfile generation (§12.11). Not a parser — we write these — and the
      # property is that the SHAPE cannot be moved. Every format is positional,
      # so a line break in a caller's name renumbers every field below it, and
      # the fields below a name include the security level.
      - name: Fuzz dropfile generation
        run: .github/scripts/fuzz.sh ./internal/door FuzzDropfile 20s

  golden:
    name: Golden frames are stable
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # §12.8: ANSI layout regressions are invisible to ordinary assertions, so
      # the whole frame is the assertion. This also catches a golden that was
      # regenerated but not committed, and any residual nondeterminism in a
      # screen (a real clock leaking into a timestamp, say).
      - name: Golden frames match, and are deterministic
        run: |
          go test ./internal/tui/ -count=1
          go test ./internal/tui/ -count=1

      # Rendering must not depend on the host's timezone. The runner is UTC and
      # a developer laptop usually is not, so without this the same golden
      # passes in one place and fails in the other — which is exactly how a
      # timezone leak reached main once already.
      - name: Golden frames are timezone independent
        run: |
          for tz in UTC Asia/Tokyo America/New_York Australia/Eucla; do
            echo "--- TZ=$tz"
            TZ=$tz go test ./internal/tui/ -count=1
          done

      - name: Golden frames are committed
        run: |
          go test ./internal/tui/ -update
          if ! git diff --quiet -- internal/tui/testdata; then
            echo "FAIL: golden files changed when regenerated — a screen is nondeterministic,"
            echo "or a regenerated golden was not committed."
            git diff -- internal/tui/testdata
            exit 1
          fi
